<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Berkeley Heritage Sites</title>
    <link rel='stylesheet' href='https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css'><link rel="stylesheet" href="./style.css">
  </head>
    
  <body>
    <h1> Heritage Map of Berkeley</h1>
    <h2> Cartographer: Mariel Del Rosario (2025).
      Source: berkeleyheritage.com
    </h2>
    
  <div id="map"></div>
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js'></script><script  src="./script.js"></script>

        <!-- FILTERING -->
  <div id="filter-container">
  <label for="date-filter"><strong>Filter Designated Date:</strong></label>
  <select id="date-filter">
    <option value="all">All Dates</option>
    <option value="before-2000">Before 2000</option>
    <option value="2000-2005">2000 – 2005</option>
    <option value="after-2005">2005 and Later</option>
  </select>
</div>
    <!-- END FILTERING -->

    
  </body>
  
</html>
